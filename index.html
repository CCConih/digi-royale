<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digi Royale v0.7a</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;touch-action:manipulation}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;display:block}

<body>
<canvas id="c" aria-label="Auto battle royale arena"></canvas>
<script src="roster.js"></script>
<script src="evo.js"></script>
<script>
// Prototype 1: auto battle royale, portrait 9:16. Sprites from digisurvivor-sprites.zip (reference/prototype use only).
const VIEW = 1.25; // zoom out: >1 shows more arena, so sprites and HUD look smaller on screen
const W = 360 * VIEW, H = 640 * VIEW, TOP = 56, BOT = H - 24, CX = W / 2, CY = (TOP + BOT) / 2;
const N = 35;
// Roster modes, toggled by the HUD button: random mix of Rookie–Mega, or every Rookie at once.
// A mode may override the ultimate damage table (kindDmg) and ranged cooldown (rangedCd): a packed 60-Rookie field
// favours area ultimates far more than the mixed game, so it gets its own sim-tuned numbers.
const MODES = { mixed: { label: 'MIXED', pool: d => d.st >= 2 && d.st <= 5, n: N },
  // retuned after the ult self-refill fix over 2×450 rookie rounds: every archetype 0.7–1.5× its fair share of wins
  // 40 random Rookies at 2× HP: sims had 60% of a full 60-Rookie field dead in 10 s; this gives ~19% and ~54 s rounds
  rookie: { label: 'ROOKIES', pool: d => d.st === 2, n: 40, hpMul: 2, rangedCd: 0.75, evolve: true, // 0.75: ranged win share = field share (38%)
    kindDmg: { projectile: 1.51, melee: 1.5, beam: 1.69, dash: 1.97, cone: 1.35, chain: 1.03, nova: 0.81, aura: 0.9, orbit: 0.84, meteor: 1.02, boomerang: 2.12 } } }; // beam/meteor/boomerang have 1 Rookie each: their rates are one Digimon's luck
let MODE = 'mixed';
// shot damage × attacker dmg, cooldown multiplier, reach in px.
// cd tuned by 300 sim rounds with ultimates (N 35, VIEW 1.25, start circle W/2): ranged win 34% vs 34% of the field.
// Very sensitive: retune whenever N, VIEW, the zone or ULT change.
let RANGED = { dmg: 0.5, cd: 0.8, range: 110 };
const STAGE_HEIGHT ={ 2: 26, 3: 36, 4: 46, 5: 58 }; // px tall: Rookie < Champion < Ultimate < Mega+
const SIZE_MUL = { Apocalymon: 1.6 }; // per-Digimon size on top of its stage (body radius scales with it)
const bodyH = d => STAGE_HEIGHT[Math.min(d.st, 5)] * (SIZE_MUL[d.n] || 1);
// shortcut: one-shot durations guessed; the real ones are in G.Sprites `r` map of app.min.js, swap in once recovered.
const DUR = { attack: 0.35, shoot: 0.25, hurt: 0.3, faint: 0.8, dissolve: 0.5, charge: 0.55, ult: 0.4 };
// Ultimate = each Digimon's signature technique (name from the site's G.DEX tech). Its shape follows the tech's archetype (see fireUlt).
// Meter fills over time and from damage dealt/taken; at full it charges, then blasts the target's area.
const ULT = { full: 100, perSec: 5, dealt: 0.6, taken: 0.4, range: 150, radius: 42, mult: 2 }; // mult × attacker dmg
const TYPE_COLOR = { fire:'#ff6a2b', water:'#3aa8ff', ice:'#a8ecff', electric:'#ffe23a', grass:'#5bd65b', dark:'#a05cff',
  fairy:'#ff8de0', steel:'#c8d0dc', flying:'#bfe6ff', ground:'#c9a066', poison:'#b04cff', bug:'#a6d13a', normal:'#ffffff' };
const ZONE_R0 = W / 2, ZONE_TIME = 70; // starts as the largest circle that fits the arena width, shrinks nonstop to 0 over ZONE_TIME seconds
const ZONE_DPS_MIN = 0.01, ZONE_DPS_MAX = 0.10; // share of max HP per second, full circle → fully closed

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fx = document.createElement('canvas'), fctx = fx.getContext('2d'); // scratch for hit flash
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

// procedural ground, painted once at half resolution (2 px pixels) from a fixed seed, so every load looks the same.
// A Digimon World 1–style meadow: lush grass patches, a winding dirt path, flowers, tufts and pebbles inside the zone;
// puffy trees, pines, boulders and a pond around it. Purely decoration: nothing collides with it.
const ground = document.createElement('canvas'); ground.width = W; ground.height = BOT - TOP;
{ const gw = W / 2 | 0, gh = (BOT - TOP) / 2 | 0, lo = Object.assign(document.createElement('canvas'), { width: gw, height: gh }), g = lo.getContext('2d');
  let seed = 7; const r = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296, rr = (a, b) => a + r() * (b - a);
  const mix = (a, b, t) => a + (b - a) * t;
  const px = (c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const ell = (c, x, y, rx, ry) => { for (let dy = -ry; dy <= ry; dy++) { const hw = Math.round(rx * Math.sqrt(1 - (dy / ry) ** 2)); px(c, x - hw, y + dy, hw * 2 + 1, 1); } };
  const cx = gw / 2, cy = (CY - TOP) / 2, R = ZONE_R0 / 2;
  // grass: smooth value noise picks one of 4 greens, with a little dither so the patches have ragged edges
  const N = 14, cols = Math.ceil(gw / N) + 2, grid = Array.from({ length: cols * (Math.ceil(gh / N) + 2) }, r), sm = t => t * t * (3 - 2 * t);
  const noise = (x, y) => { const i = x / N | 0, j = y / N | 0, fx = sm(x / N - i), fy = sm(y / N - j), k = j * cols + i;
    return mix(mix(grid[k], grid[k + 1], fx), mix(grid[k + cols], grid[k + cols + 1], fx), fy); };
  const GREENS = ['#3e8b36', '#489a3d', '#53a944', '#61b84f'];
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) px(GREENS[Math.max(0, Math.min(3, (noise(x, y) + (r() - 0.5) * 0.14) * 4 | 0))], x, y);
  // dirt path winding top to bottom through the arena
  const pathX = y => cx + Math.sin(y / 45 + 1) * 26 + Math.sin(y / 17) * 4, pathW = y => 8 + Math.sin(y / 23) * 2;
  const onPath = (x, y, pad = 0) => Math.abs(x - pathX(y)) < pathW(y) + pad;
  for (let y = 0; y < gh; y++) { const x = pathX(y), w = pathW(y); px('#8c6a3c', x - w - 1, y, w * 2 + 3); px('#c9a46a', x - w, y, w * 2 + 1); }
  for (let i = 0; i < 260; i++) { const y = rr(0, gh), x = pathX(y) + rr(-1, 1) * (pathW(y) - 1); px(r() < 0.5 ? '#dcbb84' : '#b08850', x, y, r() < 0.3 ? 2 : 1); }
  for (let i = 0; i < 26; i++) { const y = rr(0, gh), x = pathX(y) + rr(-0.7, 0.7) * pathW(y); px('#6d6a66', x, y + 1, 2); px('#a9a6a0', x, y, 2); } // pebbles
  const inZone = (x, y, pad = 0) => Math.hypot(x - cx, y - cy) < R - pad;
  // grass tufts and flowers
  for (let i = 0; i < 420; i++) { const x = rr(1, gw - 1), y = rr(2, gh); if (onPath(x, y, 2)) continue;
    const c = r() < 0.55 ? '#2f7029' : '#7ccc5c'; px(c, x - 1, y - 1); px(c, x, y - 2); px(c, x + 1, y - 1); px(c, x, y - 1); }
  const PETALS = ['#ffffff', '#ffe14a', '#ff8ad0', '#9ad8ff', '#ff6a5a'];
  for (let i = 0; i < 46; i++) { const x0 = rr(4, gw - 4), y0 = rr(4, gh - 4); if (onPath(x0, y0, 5)) continue;
    const pc = PETALS[r() * PETALS.length | 0];
    for (let k = 0, n = 2 + (r() * 4 | 0); k < n; k++) { const x = x0 + rr(-6, 6), y = y0 + rr(-4, 4);
      px('#2f7029', x, y + 2); px(pc, x - 1, y); px(pc, x + 1, y); px(pc, x, y - 1); px(pc, x, y + 1); px(pc === '#ffe14a' ? '#ff8a2a' : '#ffd23a', x, y); } }
  // pond in the lower-left corner, outside the circle
  const pond = { x: 26, y: gh - 30, rx: 20, ry: 11 };
  ell('#d6bf86', pond.x, pond.y + 1, pond.rx + 3, pond.ry + 3); ell('#2b5f8c', pond.x, pond.y, pond.rx + 1, pond.ry + 1);
  ell('#3f8bcb', pond.x, pond.y, pond.rx, pond.ry); ell('#56a3dd', pond.x - 3, pond.y - 2, pond.rx - 6, pond.ry - 5);
  for (const [dx, dy, w] of [[-9, -4, 6], [4, 2, 5], [-2, 5, 4], [9, -3, 3]]) px('#bfe6ff', pond.x + dx, pond.y + dy, w);
  for (const [dx, dy] of [[14, -6], [-15, 5]]) { ell('#2f8a3a', pond.x + dx, pond.y + dy, 3, 2); px('#ff8ad0', pond.x + dx, pond.y + dy - 1); } // lily pads
  // rocks: a few small ones inside the zone, boulders outside
  const rock = (x, y, s) => {
    ell('rgba(0,0,0,0.25)', x + 1, y + Math.round(s * 0.5), s + 1, Math.max(1, Math.round(s * 0.35)));
    ell('#3a3b45', x, y, s + 1, Math.round(s * 0.8) + 1); ell('#8e909c', x, y, s, Math.round(s * 0.8));
    ell('#6e707c', x + 1, y + Math.round(s * 0.3), Math.max(1, s - 2), Math.max(1, Math.round(s * 0.4)));
    ell('#c6c8d2', x - Math.round(s * 0.35), y - Math.round(s * 0.35), Math.max(1, Math.round(s * 0.35)), Math.max(1, Math.round(s * 0.25)));
  };
  const used = [];
  const free = (x, y, d) => !onPath(x, y, d * 0.6) && Math.hypot(x - pond.x, y - pond.y) > pond.rx + d && used.every(o => Math.hypot(o.x - x, o.y - y) > o.d + d);
  for (let i = 0, n = 0; i < 300 && n < 9; i++) { const x = rr(10, gw - 10), y = rr(10, gh - 10), s = 2 + (r() * 3 | 0);
    if (inZone(x, y, 6) && free(x, y, s + 4)) { rock(x, y, s); used.push({ x, y, d: s + 4 }); n++; } }
  // trees and boulders outside the starting circle, drawn back to front
  const props = [];
  for (let i = 0; i < 900 && props.length < 34; i++) { const x = rr(4, gw - 4), y = rr(6, gh + 4), s = rr(7, 13);
    if (!inZone(x, y, -s * 1.2) && free(x, y, s)) { props.push({ x, y, s, kind: r() < 0.14 ? 'boulder' : r() < 0.3 ? 'pine' : 'tree' }); used.push({ x, y, d: s * 0.9 }); } }
  props.sort((a, b) => a.y - b.y);
  for (const { x, y, s, kind } of props) {
    if (kind === 'boulder') { rock(x, y - s * 0.3, Math.round(s * 0.7)); continue; }
    ell('rgba(0,0,0,0.28)', x + 2, y, Math.round(s * 0.9), Math.round(s * 0.32));
    const th = Math.round(s * 0.7), tw = Math.max(2, Math.round(s * 0.3));
    px('#3b2414', x - tw / 2 - 1, y - th, tw + 2, th); px('#7a4e2a', x - tw / 2, y - th, tw, th); px('#9a6a3c', x - tw / 2, y - th, 1, th);
    if (kind === 'pine') { // three stacked tiers: dark outline, fill, lit left edge
      for (let k = 0; k < 3; k++) { const ty = y - th - k * s * 0.55, hw = s * (1 - k * 0.25), hh = s * 0.75;
        for (let dy = 0; dy <= hh; dy++) { const w = Math.round(hw * dy / hh);
          px('#173d1c', x - w - 1, ty - hh + dy, w * 2 + 3); px(dy > hh * 0.5 ? '#2a6b30' : '#348a3a', x - w, ty - hh + dy, w * 2 + 1); px('#5cb85a', x - w, ty - hh + dy, Math.max(1, w * 0.5)); } }
      continue;
    }
    const cyT = y - th - s * 0.7, puffs = [[0, -s * 0.35, s * 0.75], [-s * 0.55, 0, s * 0.62], [s * 0.55, 0, s * 0.62], [0, s * 0.15, s * 0.7]];
    for (const [dx, dy, pr] of puffs) ell('#1d4a1e', x + dx, cyT + dy, Math.round(pr) + 1, Math.round(pr) + 1);
    for (const [dx, dy, pr] of puffs) ell('#2f7d2f', x + dx, cyT + dy, Math.round(pr), Math.round(pr));
    for (const [dx, dy, pr] of puffs) ell('#49a344', x + dx - pr * 0.25, cyT + dy - pr * 0.3, Math.round(pr * 0.55), Math.round(pr * 0.5));
    for (let k = 0; k < 5; k++) px('#86d86a', x + rr(-s * 0.7, s * 0.3), cyT + rr(-s * 0.8, 0), 2, 1);
    if (r() < 0.35) for (let k = 0; k < 3; k++) px('#e8403a', x + rr(-s * 0.6, s * 0.6), cyT + rr(-s * 0.3, s * 0.5), 2, 2); // red fruit
  }
  const G = ground.getContext('2d'); G.imageSmoothingEnabled = false; G.drawImage(lo, 0, 0, ground.width, ground.height);
}

const sheets = {};
function sheet(path) { return sheets[path] || (sheets[path] = Object.assign(new Image(), { src: path })); }

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const lerp = (a, b, t) => a + (b - a) * t;

let units, shots, fxs, feed, time, speed = 1, over, endT, drops, nextDrop;
// Supply drops: a crate parachutes into the zone every few seconds holding one of four items.
// shield absorbs attack damage (not the zone) for a while, heal restores HP, ult fills the ultimate meter,
// exp gives EXP that grows as the zone shrinks: expMin at the full circle → expMax (one whole level) fully closed.
const DROP = { every: 5, fall: 0.9, life: 14, grab: 90, shield: 0.4, shieldTime: 8, heal: 0.4, expMin: 25, expMax: 100 };
const DROP_KIND = { shield: { c: '#4fd6ff', txt: 'SHIELD!' }, heal: { c: '#5be36b', txt: '+HEAL' }, ult: { c: '#ffd23a', txt: 'ULT READY!' },
  exp: { c: '#c77dff', txt: 'EXP' } };
// Zone events: once a round, at ZEV.at s or when the field is down to ZEV.field of its start (sims: ~40% into a round, 10–12 left), one random event hits.
// meteor: rocks fall for `secs`, each warns for `warn` s, then hits everyone within r for dmg × max HP (no KO credit).
// storm: a data storm slows every Digimon's movement and attacks. rain: n EXP crates drop at once.
const ZEV = { at: 25, field: 0.3, meteor: { secs: 4, every: 0.3, warn: 0.8, r: 32, dmg: 0.15 }, storm: { secs: 5, slow: 0.4 }, rain: { n: 6 } };
const ZEV_INFO = { meteor: { txt: 'METEOR SHOWER!', sub: 'Watch the red circles', c: '#ff7a3a' },
  storm: { txt: 'DATA STORM!', sub: 'Everyone is slowed', c: '#7ad7ff' }, rain: { txt: 'EXP RAIN!', sub: 'Grab the crates', c: '#c77dff' } };
let zev = null, zevDone = false, meteors = [], startN = 0;
const expDrop = zr => Math.round(lerp(DROP.expMax, DROP.expMin, Math.min(1, zr / ZONE_R0)));

function newGame() {
  const pool = ROSTER.filter(MODES[MODE].pool), n = Math.min(MODES[MODE].n, pool.length);
  const chosen = [];
  while (chosen.length < n) { const d = pick(pool); if (!chosen.includes(d)) chosen.push(d); }
  units = chosen.map((d, i) => {
    const a = i / n * Math.PI * 2, rr = rnd(0.45, 0.9) * ZONE_R0; // spawn inside the starting circle
    return mkUnit(d, CX + Math.cos(a) * rr, CY + Math.sin(a) * rr);
  });
  units.forEach(u => { sheet(u.d.s); if (MODES[MODE].evolve) preloadEvo(u.d); });
  shots = []; fxs = []; feed = []; drops = []; nextDrop = 3; time = 0; over = false; endT = 0; shake = 0;
  zev = null; zevDone = false; meteors = []; startN = units.length;
  fav = null; bannerMsg = null; duelT = 0; duelDone = units.length <= 2; // a 2-Digimon round has no "final" moment
}
function mkUnit(d, x, y) {
  const base = d.f.map || d.f.battle;
  const sc = bodyH(d) / base[3]; // on-screen height set by stage, not by sprite size
  const ranged = d.a === 'Data' || ((d.a === 'Free' || d.a === 'Unknown') && Math.random() < 0.5);
  const hp = (80 + 15 * d.st) * (MODES[MODE].hpMul || 1);
  return { d, x, y, vx: 0, vy: 0,
    hpMax: hp, hp, dmg: 8 + 2 * d.st, ranged, range: ranged ? RANGED.range : 0,
    spd: rnd(28, 38) * (d.fly ? 1.15 : 1) * (ranged ? 1.05 : 1), sc, r: base[2] * sc * 0.4, face: x > CX ? -1 : 1,
    state: 'idle', st: 0, phase: Math.random(), cd: rnd(0.5, 1.5), hitDone: false, flash: 0,
    target: null, retarget: 0, kills: 0, lvl: 1, dead: false, gone: false, ult: rnd(0, 40), ultAt: null };
}

// Special Digimon: Omnimon glows and fires "All Delete" (frames: vfx/alldelete.png, cut by tools/mkalldelete.py from
// the user's FX sheet; timing follows their pose guide: charge → vortex → slash → impact → trigger → cascade → collapse → fade).
const OMNIMON = ROSTER.find(d => d.n === 'Omnimon'); OMNIMON.u = 'All Delete';
const isOmni = u => u.d === OMNIMON;
const AD_W = 160, AD_H = 112, adImg = Object.assign(new Image(), { src: 'vfx/alldelete.png' });
// after the shot: [frame, start s, end s] — F3 slash, F4 impact, F5 trigger (damage + shake), F6 cascade, F7 collapse, F8 fade
const AD_TIMELINE = [[2, 0, 0.16], [3, 0.16, 0.32], [4, 0.32, 0.6], [5, 0.6, 0.82], [6, 0.82, 0.98], [7, 0.98, 1.15]];
const AD = { slash: 0.6, blast: 1.4, radius: 75, trigger: 0.32 }; // damage × the ult's base damage
let shake = 0;
// Custom attack animations from the user's per-Digimon guide sheets. The poses replace the sprite while charging and
// during the ult. Strip frames are w×h and face right; (ax, feet) = foot anchor, body = body height in frame px,
// mouth = where breath effects start (frame px from the anchor). charge: pose frames spread over the charge;
// seq: [pose, until s] after the ult fires, and the ult state lasts until the last one ends.
const ANIM = {
  Omnimon: { img: 'vfx/omnimon-poses.png', w: 133, h: 142, ax: 66.5, feet: 133, body: 115, charge: [0, 1],      // tools/mkomniposes.py
    seq: AD_TIMELINE.map(([f, , t1]) => [f, t1]) },
  Gabumon: { img: 'vfx/gabumon-poses.png', w: 128, h: 107, ax: 57, feet: 101, body: 75, charge: [0, 1, 2],        // tools/mkguide.py
    seq: [[3, 0.14], [4, 0.3], [5, 0.5], [6, 0.68], [7, 0.85]], mouth: [38, -41] },
};
for (const A of Object.values(ANIM)) A.im = Object.assign(new Image(), { src: A.img });
const animOf = u => ANIM[u.d.n];
const animScale = u => u.sc * (u.d.f.map || u.d.f.battle)[3] * 1.1 / animOf(u).body; // body matches the normal sprite height
function customPose(u) {
  const A = animOf(u); if (!A || u.dead) return -1;
  if (u.state === 'charge') return A.charge[Math.min(A.charge.length - 1, Math.floor(u.st / DUR.charge * A.charge.length))];
  if (u.state === 'ult') return (A.seq.find(s => u.st < s[1]) || A.seq.at(-1))[0];
  return -1;
}
// Gabumon "Petit Fire": special-fx.png row 1 frames F4–F8 (cone blast → spread → eruption → embers → dissolve) from his
// mouth. It reuses his pose timing (ANIM.Gabumon.seq): pose frame n and fx frame n line up, so they can't drift apart.
const SFX_W = 96, SFX_H = 100, sfxImg = Object.assign(new Image(), { src: 'vfx/special-fx.png' });

// Basic attacks (vfx/basic-vfx.png, cut by tools/mkguide.py basic-vfx): 10 element rows × [projectile, melee], 112×26,
// all pointing right. Game types map onto the sheet's 10 elements; anything unlisted uses steel.
const BV_W = 112, BV_H = 26, bvImg = Object.assign(new Image(), { src: 'vfx/basic-vfx.png' });
const BASIC_ROW = { fire: 0, dragon: 0, water: 1, ice: 2, electric: 3, grass: 4, bug: 4, ground: 5, flying: 6, steel: 7, normal: 7,
  fairy: 8, psychic: 8, dark: 9, poison: 9 };
const basicRow = u => BASIC_ROW[u.d.t] ?? 7;
function drawBasic(row, col, x, y, ang, sc, alpha = 1) { // col 0 projectile, 1 melee; stays upright when aimed left
  if (!bvImg.naturalWidth) return false;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(ang); if (Math.cos(ang) < 0) ctx.scale(1, -1);
  ctx.drawImage(bvImg, col * BV_W, row * BV_H, BV_W, BV_H, -BV_W * sc / 2, -BV_H * sc / 2, BV_W * sc, BV_H * sc); ctx.restore(); return true;
}
function drawAD(frame, x, y, sc, flip, alpha = 1) {
  if (!adImg.naturalWidth) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(Math.round(x), Math.round(y)); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(adImg, frame * AD_W, 0, AD_W, AD_H, -AD_W * sc / 2, -AD_H * sc / 2, AD_W * sc, AD_H * sc); ctx.restore();
}
function allDelete(u, tx, ty, D) {
  const ox = u.x, oy = u.y - 14, ang = Math.atan2(ty - oy, tx - ox);
  hitLine(u, ox, oy, ang, Math.hypot(tx - ox, ty - oy) + 30, 18, D * AD.slash); // the slash cuts through everything on the way
  fxs.push({ kind: 'alldelete', x1: ox, y1: oy, x2: tx, y2: ty, t: 0, life: AD_TIMELINE.at(-1)[2] });
  later(AD.trigger, () => { hitCircle(u, tx, ty, AD.radius, D * AD.blast); shake = 0.35; fxs.push({ kind: 'blast', x: tx, y: ty, r: AD.radius, c: '#ffd23a', t: 0, life: 0.5 }); });
}
function spawnOmnimon() {
  if (over) newGame();
  const a = rnd(0, Math.PI * 2), r = Math.sqrt(Math.random()) * zoneR(time) * 0.5, u = mkUnit(OMNIMON, CX + Math.cos(a) * r, CY + Math.sin(a) * r);
  sheet(OMNIMON.s); units.push(u);
  fxs.push({ kind: 'adframe', f: 1, u, sc: 0.7, t: 0, life: 0.6 }); // arrives in a digital vortex

    else if (d.kind === 'ult') u.ult = ULT.full;
    const xp = d.kind === 'exp' && expDrop(zr);
    fxs.push({ kind: 'name', u, txt: xp ? `+${xp} EXP` : DROP_KIND[d.kind].txt, c: DROP_KIND[d.kind].c, t: 0, life: 1.2 },
             { kind: 'blast', x: d.x, y: d.y - 6, r: 22, c: DROP_KIND[d.kind].c, t: 0, life: 0.35 });
    if (xp) gainExp(u, xp); // after the popup, so a DIGIVOLVE! popup lands on top
  }
  drops = drops.filter(d => !d.taken && d.t < DROP.fall + DROP.life);
}

function update(dt) {
  time += dt; shake = Math.max(0, shake - dt);
  const zr = zoneR(time), alive = units.filter(u => !u.dead);
  updateDrops(dt, zr, alive); updateEvent(dt, zr, alive);
  const storm = stormSlow();
  for (const u of units) {
    u.st += dt; u.flash = Math.max(0, u.flash - dt);
    if (u.dead) { if (u.st > DUR.faint + DUR.dissolve) u.gone = true; continue; }
    u.ult = Math.min(ULT.full, u.ult + ULT.perSec * dt);
    if (u.slowT > 0 && (u.slowT -= dt) <= 0) u.slow = 0;
    if (u.shieldT > 0 && (u.shieldT -= dt) <= 0) u.shield = 0;
    if (u.burn > 0) {
      u.burnT -= dt; u.burnTick = (u.burnTick || 0.5) - dt;
      if (u.burnTick <= 0) { u.burnTick = 0.5; damage(u, u.burn * BURN_TICK * u.burnFrom.dmg, u.burnFrom, true); } // no stagger; KO credits the burner
      if (u.burnT <= 0) u.burn = 0;
      if (u.dead) continue;
    }
    if (u.state === 'charge' && u.st >= DUR.charge) { fireUlt(u); setState(u, 'ult'); }
    else if (u.state in DUR && u.st >= (u.state === 'ult' && animOf(u) ? animOf(u).seq.at(-1)[1] : DUR[u.state])) setState(u, 'idle'); // custom animations hold their poses to the end

    // pick target: nearest living enemy
    if ((u.retarget -= dt) <= 0 || !u.target || u.target.dead) {
      u.retarget = 0.5; u.target = null; let best = 1e9;
      for (const o of alive) if (o !== u) { const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < best) { best = d; u.target = o; } }
    }
    const t = u.target, outside = Math.hypot(u.x - CX, u.y - CY) > zr;
    let mx = 0, my = 0;
    if (outside) { mx = CX - u.x; my = CY - u.y; damage(u, u.hpMax * zoneDps(zr) * dt, null); }
    if (t) {
      const dx = t.x - u.x, dy = t.y - u.y, d = Math.hypot(dx, dy) || 1, reach = u.ranged ? u.range : u.r + t.r + 4;
      if (Math.abs(dx) > 2 && u.state !== 'charge' && u.state !== 'ult') u.face = dx > 0 ? 1 : -1; // hold facing through an attack
      if (!outside) {
        if (d > reach) { mx = dx; my = dy; } else if (u.ranged && d < 55) { mx = -dx; my = -dy; }
        if (u.ult >= ULT.full && d > ultRange(u)) { mx = dx; my = dy; } // close in for short-range ultimates
        // grab a landed crate if one is close and nearer than the fight
        let best = null, bd = DROP.grab;
        for (const p of drops) if (p.t >= DROP.fall) { const pd = Math.hypot(p.x - u.x, p.y - u.y); if (pd < bd && pd < d) { bd = pd; best = p; } }
        if (best) { mx = best.x - u.x; my = best.y - u.y; }
      }
      u.cd -= dt * (1 - Math.max(u.slow || 0, storm)); // slow also drags attack speed (site only slows movement; that barely mattered in a brawl)
      if (u.ult >= ULT.full && d <= ultRange(u) &&(u.state === 'idle' || u.state === 'walk')) {
        setState(u, 'charge'); u.ultAt = t;
        fxs.push({ kind: 'name', u, txt: u.d.u + '!', c: ultColor(u), t: 0, life: 1.4 });
      } else if (d <= reach + 2 && u.cd <= 0 && (u.state === 'idle' || u.state === 'walk')) {
        u.cd = rnd(0.9, 1.3) * (u.ranged ? MODES[MODE].rangedCd || RANGED.cd : 1);
        if (u.ranged) {
          setState(u, 'shoot');
          shots.push({ x: u.x, y: u.y - 10, vx: dx / d * 220, vy: dy / d * 220, owner: u, dmg: u.dmg * RANGED.dmg, life: 0.8, c: TYPE_COLOR[u.d.t] || '#fff', row: basicRow(u) });
        } else setState(u, 'attack');
      }
      if (u.state === 'attack' && !u.hitDone && u.st >= DUR.attack * 0.5) { u.hitDone = true;
        if (d <= reach + 8) { damage(t, u.dmg, u); fxs.push({ kind: 'basicmelee', row: basicRow(u), x: t.x, y: t.y - 10, ang: Math.atan2(dy, dx), t: 0, life: 0.22 }); } }
    }
    // separation so they don't stack
    for (const o of alive) if (o !== u) {
      const dx = u.x - o.x, dy = u.y - o.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < u.r + o.r) { u.x += dx / d * (u.r + o.r - d) * 0.5; u.y += dy / d * (u.r + o.r - d) * 0.5; }
    }
    const ml = Math.hypot(mx, my), busy = !outside && ['attack', 'hurt', 'charge', 'ult'].includes(u.state); // never stuck in the storm
    if (ml > 0 && !busy) {
      const sp = u.spd * (1 - Math.max(u.slow || 0, storm));
      u.x += mx / ml * sp * dt; u.y += my / ml * sp * dt;
      if (u.state === 'idle') u.state = 'walk';
      u.phase += 2.6 * dt;
    } else if (u.state === 'walk') u.state = 'idle';
    if (u.dash) { const q = Math.min(1, u.st / 0.25); u.x = lerp(u.dash.x0, u.dash.x1, q); u.y = lerp(u.dash.y0, u.dash.y1, q); }
    u.x += u.vx * dt; u.y += u.vy * dt; u.vx *= Math.pow(0.002, dt); u.vy *= Math.pow(0.002, dt);
    u.x = Math.max(12, Math.min(W - 12, u.x)); u.y = Math.max(TOP + 20, Math.min(BOT - 4, u.y));
  }
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const u of units) if (!u.dead && u !== s.owner && Math.hypot(u.x - s.x, u.y - 10 - s.y) < u.r + 3) { damage(u, s.dmg, s.owner, true); s.life = 0; break; }
  }
  shots = shots.filter(s => s.life > 0);
  fxs.forEach(f => {
    f.t += dt;
    if (f.done || f.t < f.life) return;
    if (f.kind === 'ultshot' && !f.back) { f.done = true; ultBlast(f.hit); }
    else if (f.kind === 'later') { f.done = true; f.apply(); }
  });
  fxs = fxs.filter(f => f.t < f.life);
  units = units.filter(u => !u.gone);
  feed.forEach(f => f.t -= dt); feed = feed.filter(f => f.t > 0);
  const left = units.filter(u => !u.dead);
  if (!duelDone && left.length === 2) { duelDone = true; duelT = DUEL.secs; duelNames = `${left[0].d.n} vs ${left[1].d.n}`; }
  if (!over && left.length <= 1) { over = true; endT = 0; duelT = 0; }
  if (over) endT += dt;
}

// procedural animator, formulas from ANIMATION_NOTES.md
function anim(u, t) {
  const f = u.face, p = u.st / (DUR[u.state] || 1);
  let ox = 0, oy = 0, sy = 1, alpha = 1, pose = 'map';
  switch (u.state) {
    case 'idle': oy = -Math.round((Math.sin(2.4 * t + u.phase * 9) + 1) / 2); sy = 1 + 0.015 * Math.sin(2.4 * t + u.phase * 9); break;
    case 'walk': { const s = Math.sin(u.phase * Math.PI); ox = Math.round(0.8 * s); oy = -Math.round(2 * Math.abs(s)); sy = 0.95 + 0.07 * Math.abs(s); break; }
    case 'attack': pose = 'attack'; ox = 4 * f * Math.sin(Math.PI * p); oy = -Math.sin(Math.PI * p); break;
    case 'shoot': pose = 'attack'; ox = -2 * f * Math.sin(Math.PI * p); break;
    case 'charge': pose = 'battle'; ox = Math.sin(70 * t); sy = 1 - 0.08 * Math.sin(Math.PI * p); break;
    case 'ult': pose = 'attack'; ox = 6 * f * Math.sin(Math.PI * p); oy = -2 * Math.sin(Math.PI * p); break;
    case 'hurt': pose = 'hit'; ox = -2 * f * (1 - p); sy = 1 - 0.1 * (1 - p); break;
    case 'faint': pose = 'hit';
      if (p < 0.3) { ox = -2 * f * p / 0.3; oy = -3 * Math.sin(p / 0.3 * Math.PI); }
      else sy = 1 - 0.28 * Math.min(1, (p - 0.3) / 0.4);
      if (u.st > DUR.faint) alpha = 1 - (u.st - DUR.faint) / DUR.dissolve;
      break;
  }
  return { ox, oy, sy, alpha: Math.max(0, alpha), pose };
}

function frameFor(u, pose) {
  const F = u.d.f, fr = F[pose] || F.battle || F.map;
  // big poses get shrunk to the map pose's size so the character doesn't balloon mid-attack
  const big = F.battle || F.hit || F.attack; // some sheets have no battle pose: match the other big poses instead
  const k = F.map && fr !== F.map ? F.map[3] / big[3] : 1; // no map pose: sizing already uses battle
  return { fr, k };
}

function drawUnit(u, t) {
  const a = anim(u, t), { fr, k } = frameFor(u, a.pose), img = sheet(u.d.s);
  const [sx, sy0, w, h, ax, ay] = fr, s = u.sc * k;
  const hover = u.d.fly ? 10 + 2 * Math.sin(2 * t + u.phase * 7) : 0;
  ctx.globalAlpha = a.alpha * 0.35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(u.x, u.y, u.r * (u.d.fly ? 0.8 : 1.1), u.r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  if (!u.dead && (u.burn > 0 || u.slow > 0)) { // status pool under the feet, like the site's burn ellipse
    ctx.globalAlpha = 0.4 + 0.1 * Math.sin(t * 12); ctx.fillStyle = u.burn > 0 ? '#ff8a3d' : '#8fe3ff';
    ctx.beginPath(); ctx.ellipse(u.x, u.y, u.r * 1.2, u.r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }
  const omni = isOmni(u) && !u.dead, hh = h * s, my = u.y - hh / 2 - hover;
  if (omni) { // special: pulsing gold + cyan aura behind the body; the charge shows F1 (sword of light rising) behind him
    ctx.globalCompositeOperation = 'lighter'; // additive, so it reads as light on the grass
    glow(u.x, my, hh * 1.1, '#ffd23a', 0.55 + 0.15 * Math.sin(t * 5));
    glow(u.x, my, hh * 0.75, '#8ff0ff', 0.4 + 0.12 * Math.sin(t * 5 + 2));
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 6); ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 1.5; // glowing ring at his feet
    ctx.beginPath(); ctx.ellipse(u.x, u.y, u.r * 1.6, u.r * 0.55, 0, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = a.alpha;
  const op = customPose(u);
  if (op >= 0 && animOf(u).im.naturalWidth) { // pose from the user's guide replaces the sheet sprite
    const A = animOf(u), k = animScale(u);
    ctx.save(); ctx.translate(Math.round(u.x), Math.round(u.y - hover)); ctx.scale(u.face > 0 ? k : -k, k); // guides face right
    ctx.drawImage(A.im, op * A.w, 0, A.w, A.h, -A.ax, -A.feet, A.w, A.h); ctx.restore();
  } else if (img.complete && img.naturalWidth) {
    ctx.save();
    ctx.translate(u.x + a.ox * u.sc, u.y + a.oy * u.sc - hover);
    ctx.scale(u.face > 0 ? -s : s, s * a.sy); // sheets face left as drawn
    ctx.drawImage(img, sx, sy0, w, h, -ax, -ay, w, h);
    if (u.flash > 0) {
      if (fx.width < w || fx.height < h) { fx.width = Math.max(fx.width, w); fx.height = Math.max(fx.height, h); } // grow only: resizing reallocates
      fctx.clearRect(0, 0, fx.width, fx.height); fctx.drawImage(img, sx, sy0, w, h, 0, 0, w, h);
      fctx.globalCompositeOperation = 'source-in'; fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, w, h); fctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a.alpha * Math.min(1, u.flash / 0.06); ctx.drawImage(fx, -ax, -ay);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  if (omni) { // data sparkles rising around him (the charge effects are baked into his guide poses)
    for (let i = 0; i < 6; i++) {
      const q = (t * 0.7 + i / 6 + u.phase) % 1;
      ctx.globalAlpha = 1 - q; ctx.fillStyle = i % 2 ? '#ffe58a' : '#8ff0ff';
      ctx.fillRect(Math.round(u.x + Math.sin(i * 2.1 + t * 2) * u.r * 1.1), Math.round(u.y - q * hh * 1.2), 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  if (!u.dead && u.burn > 0) for (let i = 0; i < 2 + Math.min(4, u.burn); i++) { // embers rising
    const q = (t * 1.6 + i * 0.37 + u.phase) % 1;
    ctx.globalAlpha = 1 - q; ctx.fillStyle = q < 0.4 ? '#ffe28a' : '#ff6a1f';
    ctx.fillRect(Math.round(u.x + Math.sin(i * 2.3 + t * 3) * u.r * 0.8), Math.round(u.y - 4 - q * h * s), 3, 3);
  }
  if (!u.dead && u.slow > 0) for (let i = 0; i < 4; i++) { // frost specks drifting down
    const q = (t * 0.9 + i * 0.25 + u.phase) % 1;
    ctx.globalAlpha = 0.9 * (1 - q); ctx.fillStyle = i % 2 ? '#ffffff' : '#bff3ff';
    ctx.fillRect(Math.round(u.x + Math.cos(i * 1.7) * u.r), Math.round(u.y - h * s * (1 - q)), 2, 2);
  }
  ctx.globalAlpha = 1;
  if (!u.dead && u.shield > 0 && (u.shieldT > 1.5 || Math.sin(t * 20) > 0)) { // shield bubble, blinks before it runs out
    const cy = u.y - h * s / 2 - hover, rr = Math.max(u.r * 1.6, h * s * 0.62), q = u.shield / u.shieldMax;
    ctx.globalAlpha = 0.12 + 0.1 * q; ctx.fillStyle = '#4fd6ff'; ctx.beginPath(); ctx.arc(u.x, cy, rr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.5 + 0.4 * q; ctx.strokeStyle = '#bff3ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.globalAlpha = 0.8; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(u.x, cy, rr * 0.8, -2.4, -1.7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (!u.dead) { // hp bar
    const bw = 22, bx = u.x - bw / 2, by = u.y - h * s - hover - 6, r = u.hp / u.hpMax;
    ctx.fillStyle = '#000a'; ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
    ctx.fillStyle = r > 0.5 ? '#5be36b' : r > 0.25 ? '#ffd23a' : '#ff4a4a'; ctx.fillRect(bx, by, bw * r, 2);
    const m = u.ult / ULT.full; // ultimate meter, flashes when ready
    ctx.fillStyle = m >= 1 ? (Math.sin(t * 16) > 0 ? '#fff' : '#4fd6ff') : '#2f9fd0'; ctx.fillRect(bx, by + 2, bw * m, 1);
    ctx.fillStyle = '#c77dff'; ctx.fillRect(bx, by + 3, bw * (u.exp || 0) / LEVEL_EXP, 1); // exp toward next level
    if (u.lvl > 1) { ctx.fillStyle = '#ffe58a'; ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Lv' + u.lvl, bx + bw + 2, by + 3); }
  }
}

// pixel crate: parachute while falling, glow + bob once landed, blinks before it expires
function drawCrate(d, t) {
  const c = DROP_KIND[d.kind].c, falling = d.t < DROP.fall, p = Math.min(1, d.t / DROP.fall);
  const left = DROP.fall + DROP.life - d.t;
  if (!falling && left < 3 && Math.sin(t * 18) < 0) return;
  const x = Math.round(d.x), y = Math.round(falling ? d.y - 160 * (1 - p) : d.y - 2 - Math.abs(Math.sin(t * 3)) * 2);
  ctx.save(); ctx.translate(x, y); ctx.scale(1.4, 1.4); ctx.translate(-x, -y);
  if (falling) { // canopy + cords
    ctx.fillStyle = '#e8eef5'; ctx.beginPath(); ctx.arc(x, y - 22, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = c; ctx.fillRect(x - 4, y - 34, 8, 12);
    ctx.strokeStyle = '#e8eef5'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(x - 12, y - 22); ctx.lineTo(x - 6, y - 10); ctx.moveTo(x + 12, y - 22); ctx.lineTo(x + 6, y - 10); ctx.stroke();
  } else glow(x, y - 6, 18, c, 0.35 + 0.15 * Math.sin(t * 5));
  ctx.fillStyle = '#1b1f27'; ctx.fillRect(x - 8, y - 13, 16, 13);           // outline
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x - 7, y - 12, 14, 11);           // wood
  ctx.fillStyle = '#a8743c'; ctx.fillRect(x - 7, y - 12, 14, 2);
  ctx.fillStyle = c; ctx.fillRect(x - 5, y - 9, 10, 7);                     // label
  ctx.fillStyle = '#fff';
  if (d.kind === 'heal') { ctx.fillRect(x - 1, y - 8, 2, 5); ctx.fillRect(x - 3, y - 6, 6, 1.5); }
  else if (d.kind === 'shield') { ctx.fillRect(x - 3, y - 8, 6, 3); ctx.fillRect(x - 2, y - 5, 4, 1.5); ctx.fillRect(x - 1, y - 3.5, 2, 1); }
  else if (d.kind === 'exp') { ctx.fillRect(x - 1, y - 8, 2, 1); ctx.fillRect(x - 2, y - 7, 4, 1); ctx.fillRect(x - 3, y - 6, 6, 1); ctx.fillRect(x - 1, y - 5, 2, 3); } // up arrow
  else { ctx.fillRect(x, y - 8, 2, 2); ctx.fillRect(x - 1, y - 6, 2, 2); ctx.fillRect(x - 2, y - 4, 4, 1); ctx.fillRect(x - 1, y - 3, 1, 1); }
  ctx.restore();
}

function text(s, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px system-ui,sans-serif`; ctx.textAlign = align;
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}

const speedBtn = { x: W - 54, y: 12, w: 44, h: 30 }, modeBtn = { x: W - 150, y: 12, w: 88, h: 30 };
const omniBtn = { x: W - 104, y: BOT + 2, w: 98, h: 20 }; // bottom bar, right of the zone text
const inBtn = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

function draw(t) {
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0, 0, W, H);
  ctx.save(); if (shake > 0) ctx.translate(rnd(-4, 4) * shake / 0.35, rnd(-4, 4) * shake / 0.35); // All Delete screen shake (world only, not the HUD)
  ctx.drawImage(ground, 0, TOP);
  // storm outside the zone
  const zr = zoneR(time);
  ctx.save(); ctx.beginPath(); ctx.rect(0, TOP, W, BOT - TOP); ctx.arc(CX, CY, Math.max(0, zr), 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(110,40,200,0.26)'; ctx.fill(); ctx.restore(); // light enough to keep the scenery's colours
  if (zr > 0) { ctx.strokeStyle = '#d9b3ff'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.arc(CX, CY, zr, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }

  for (const d of drops) if (d.t >= DROP.fall) drawCrate(d, t); else { // shadow grows as it falls
    const p = d.t / DROP.fall; ctx.globalAlpha = 0.3 * p; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(d.x, d.y, 9 * p, 3.5 * p, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  for (const m of meteors) { const p = m.t / ZEV.meteor.warn; // red warning circle fills up until the rock lands
    ctx.fillStyle = 'rgba(255,70,40,0.18)'; ctx.beginPath(); ctx.arc(m.x, m.y, ZEV.meteor.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff5a3a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,90,40,0.35)'; ctx.beginPath(); ctx.arc(m.x, m.y, ZEV.meteor.r * p, 0, Math.PI * 2); ctx.fill();
  }
  [...units].sort((a, b) => a.y - b.y).forEach(u => drawUnit(u, t));
  const fall = Math.atan2(260, -90); // meteors streak in from the upper right
  for (const m of meteors) { const p = m.t / ZEV.meteor.warn, x = m.x + 90 * (1 - p), y = m.y - 260 * (1 - p);
    for (let k = 1; k <= 3; k++) drawSkill('fireball', 6, x + 90 * k * 0.09, y - 260 * k * 0.09, fall, 0.35, 0.5 - k * 0.13); // ember-frame trail
    drawSkill('fireball', flyFrame('fireball', m.t), x, y, fall, 0.5);
  }
  if (stormSlow()) { // data storm: blue tint and fast diagonal streaks over the arena
    const a = Math.min(1, zev.t * 3, (ZEV.storm.secs - zev.t) * 3);
    ctx.fillStyle = `rgba(60,140,255,${0.12 * a})`; ctx.fillRect(0, TOP, W, BOT - TOP);
    ctx.strokeStyle = `rgba(180,230,255,${0.45 * a})`; ctx.lineWidth = 1;
    for (let i = 0; i < 36; i++) { const x = (i * 97 + t * 420) % (W + 60) - 30, y = TOP + (i * 61 + t * 260) % (BOT - TOP);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 14, y - 9); ctx.stroke(); }
  }
  for (const d of drops) if (d.t < DROP.fall) drawCrate(d, t);
  for (const s of shots) if (!drawBasic(s.row, 0, s.x, s.y, Math.atan2(s.vy, s.vx), 0.28)) { // ~31 px element bolt; dot until the sheet loads
    ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  for (const f of fxs) {
    if (f.t < 0 || f.kind === 'later') continue; // not started yet
    const p = f.t / f.life;
    if (f.kind === 'beam') {
      ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.c; ctx.lineWidth = 5 * (1 - p) + 1;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
